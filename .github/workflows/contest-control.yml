name: Contest Control

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      action:
        description: 'Start or stop the contest'
        required: true
        type: choice
        options:
          - start
          - stop

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update contest state to start (scheduled)
        if: github.event_name == 'schedule'
        run: |
          echo '{"active": true}' > contest.json

      - name: Update contest state (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.action }}" = "start" ]; then
            echo '{"active": true}' > contest.json
          else
            echo '{"active": false}' > contest.json
          fi

      - name: Commit state
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add contest.json
          git commit -m "contest: start - weekly winner announcement" || echo "No changes to commit"
          git push || echo "Nothing to push"

      - name: Trigger bot workflow
        run: |
          gh workflow run run-bot.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
